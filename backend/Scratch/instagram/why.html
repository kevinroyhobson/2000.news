<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  overflow: hidden;
  background-color: #ffffff;
  color: #1f2328;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
}

a {
  color: #0969da;
  text-decoration: none;
}

svg {
  fill: currentColor;
  vertical-align: middle;
}

.page {
  position: absolute;
  top: 220px;
  left: 40px;
  right: 40px;
}

.repo-header {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 36px;
  font-size: 44px;
}

.repo-header .icon {
  color: #59636e;
}

.repo-header strong {
  font-weight: 600;
}

.visibility {
  padding: 0 18px;
  border: 2px solid #d1d9e0;
  border-radius: 999px;
  color: #59636e;
  font-size: 28px;
  font-weight: 500;
  line-height: 46px;
}

.readme {
  border: 2px solid #d1d9e0;
  border-radius: 16px;
  overflow: hidden;
}

.readme-header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 22px 32px;
  border-bottom: 2px solid #d1d9e0;
  font-size: 34px;
  font-weight: 600;
}

.committed-at {
  margin-left: auto;
  color: #59636e;
  font-size: 30px;
  font-weight: 400;
}

.readme-body {
  padding: 40px;
  font-size: 48px;
  line-height: 1.5;
}

.readme-body p {
  margin: 0 0 1em;
}

.readme-body p:last-child {
  margin-bottom: 0;
}
</style>
</head>
<body>
<div class="page">
  <div class="repo-header">
    <svg class="icon" width="44" height="44" viewBox="0 0 16 16"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>
    <span><a>$owner</a> / <a><strong>$repo</strong></a></span>
    <span class="visibility">Public</span>
  </div>
  <div class="readme">
    <div class="readme-header">
      <svg width="36" height="36" viewBox="0 0 16 16"><path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z"/></svg>
      README
      <span class="committed-at">$committed_at</span>
    </div>
    <div class="readme-body">$paragraphs</div>
  </div>
</div>
<script>
  // Instagram's reply bar covers the bottom ~220px of a story.
  const page = document.querySelector('.page');
  const body = document.querySelector('.readme-body');
  let fontSize = 48;
  while (page.getBoundingClientRect().bottom > 1700 && fontSize > 24) {
    fontSize -= 1;
    body.style.fontSize = fontSize + 'px';
  }
</script>
</body>
</html>
